services:
  db:
    image: postgres:16-alpine
    container_name: disaster_relief_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: disaster_relief
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/db:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d disaster_relief"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
